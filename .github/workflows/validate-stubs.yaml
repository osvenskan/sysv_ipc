name: Validate type stubs

on:
  push:
    branches:
      - develop
      - master
  pull_request:
  workflow_call:

jobs:
  validate_stubs:
    name: Validate type stubs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install mypy and package
        run: python -m pip install mypy .

      - name: Validate type stubs
        # https://github.com/python/mypy/issues/19737
        run: python3 -m mypy.stubtest --ignore-disjoint-bases sysv_ipc
